<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A lightweight text editor for quick note-taking, rich-text formatting, and instant HTML export, all running directly in your browser.">
<title>Text Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="heading-container">
      <h1>Text Editor</h1>
    </div>

<div class="format-toolbar" id="format-toolbar" title="Format Toolbar">
    <div class="format-options" id="format-options">
        <button type="button" onclick="format('b')" title="Bold"><b>B</b></button>
        <button type="button" onclick="format('i')" title="Italics"><i>I</i></button>
        <button type="button" onclick="format('u')" title="Underline"><u>U</u></button>
        <button type="button" onclick="format('s')" title="Strikethrough"><s>A</s></button>
        <button type="button" onclick="format('mark')" title="Mark"><mark>A</mark></button>
        <button type="button" onclick="format('code')" title="Code"><code>A</code></button>
        <button type="button" onclick="format('sup')" title="Supscript"><p>A<sup>n</sup></p></button>
        <button type="button" onclick="format('sub')" title="Subscript"><p>A<sub>n</sub></p></button>
    </div>
</div>

<div id="editor" class="editor" contenteditable="true">
    
</div>

<div class="toolbar" id="toolbar" title="Toolbar">
    <div class="toolbar-options" id="toolbar-options">
        <button type="button" onclick="leftAlign()" title="Left Align"><img class="icon" src="assets/icons/align-left.svg"></button>
        <button type="button" onclick="rightAlign()" title="Right Align"><img class="icon" src="assets/icons/align-right.svg"></button>
        <button type="button" onclick="centerAlign()" title="Center Align"><img class="icon" src="assets/icons/align-center.svg"></button>
        <button type="button" onclick="justify()" title="Justify"><img class="icon" src="assets/icons/justify.svg"></button>
        <button type="button" onclick="lineBreak()" title="Line Break"><img class="icon" src="assets/icons/line-break.svg"></button>
        <button type="button" onclick="clearFormat()" title="Clear Formatting"><img class="icon" src="assets/icons/clear-formatting.svg"></button>
        <button type="button" onclick="clearEditor()" title="Clear Editor"><img class="icon" src="assets/icons/clear-editor.svg"></button>
        <button type="button" onclick="backSpaceFun()" title="Backspace"><img class="icon" src="assets/icons/backspace.svg"></button>
    </div>
</div>

  <div class="font-family">
    <select title="Select font family" id="fontFamily">
      <option value="inherit">Default</option>
      <option value="Arial">Arial</option>
      <option value="Helvetica">Helvetica</option>
      <option value="Courier New">Courier New</option>
      <option value="Georgia">Georgia</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Verdana">Verdana</option>
      <option value="Trebuchet MS">Trebuchet MS</option>
      <option value="Lucida Console">Lucida Console</option>
      <option value="monospace">Monospace</option>
      <option value="Comic Sans MS">Comic Sans MS</option>
      <option value="fantasy">Fantasy</option>
      <option value="cursive">Cursive</option>
      <option value="gill-sans">Gill-sans</option>
    </select>
  </div>

<div id="counter-box">
    <input id="word-counter" placeholder="WORDS HERE" title="Word Counter" disabled />
    <input id="char-counter" placeholder="CHARCATERS HERE" title="Character Counter" disabled />
</div>

  <div class="font-control-bar">
    <input type="color" title="Font Color" class="font-color-changer" placeholder="Color" id="font-color-changer" />
    <input type="range" title="Font Size" class="font-size-changer" placeholder="Font Size" min="8" max="72" value="16" step="1" id="font-size-changer" />
  </div>

<button id="download-button" onclick="saveFile()" title="Download as HTML"><img class="icon" src="assets/icons/download.svg"></button>


<button type="button" title="Settings" id="settings-icon" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel">
    <img class="icon" src="assets/icons/settings.svg">
</button>
<div class="overlay"></div>
<div class="settings-panel">
    <div class="settings-header">
        <h2>Settings</h2>
        <button type="button" id="settings-close">x</button>
    </div>

    <div class="settings-content">
        <div class="settings-option" data-setting="formatToolbarPosition">
            <span>Format Toolbar Position</span>
                <select id="format-toolbar-position">
                    <option value="auto">Auto</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                </select>
        </div>
        <div class="settings-option" data-setting="theme">
            <span>Theme</span>
                <select id="theme">
                    <option value="auto">Auto</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
        </div>
    </div>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
