<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A lightweight text editor for quick note-taking, rich-text formatting, and instant HTML export, all running directly in your browser.">
<title>Text Editor</title>
<style>
:root{
--ui-background: #f5f7fb;
--ui-panel: #ffffff;
--ui-border: #d6dde8;
--ui-border-strong: #94a3b8;
--ui-accent: #4f46e5;
--ui-btn-bg: #eef2f7;
--ui-text: #1e293b;
--ui-transparent: rgba(30, 41, 59, 0.18);

--ui-shadow:
0 2px 4px rgba(0,0,0,.04),
0 8px 20px rgba(0,0,0,.08);
}

body.dark-mode{
  --ui-background: #0b0f12;
  --ui-panel: #1b2226;
  --ui-border: #2a3338;
  --ui-border-strong: #9aa7ad;
  --ui-accent: #14b8a6;
  --ui-btn-bg: #263238;
  --ui-text: #e7eef0;
  --ui-transparent: rgba(231, 238, 240, 0.12);
  --ui-shadow:
    0 2px 4px rgba(0,0,0,.45),
    0 8px 24px rgba(0,0,0,.65);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:var(--ui-background);
    color:var(--ui-text);
    display:flex;
    flex-direction:column;
    align-items: center;
    height:100vh;
    border-top:4px solid var(--ui-accent);
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    width: 100%;
    }

.heading-container {
    text-align: left;
    align-self: center;
    align-items: center;
    justify-items: center;
    margin: 0;
}

.heading-container h1{
    color: var(--ui-text);
}

.icon {
    width: 1em;
    height: 1em;
    display: inline-block;
    vertical-align: middle;
}

.format-toolbar button > * {
    line-height: 1;
    vertical-align: middle;
}

.format-toolbar, .toolbar{
    width:100%;
    justify-items: center;
    margin-bottom: 5px;
    margin-top: 5px;
}

.format-options, .toolbar-options{
    display:flex;
    gap:8px;
    padding:3px;
    width: 80%;
    border:1px solid var(--ui-border);
    border-radius: 12px;
    align-items: center;
    justify-content:flex-start;
    overflow-x: auto;
    scrollbar-width: none;
    scroll-behavior:smooth;
    background-color:var(--ui-panel);
    box-shadow:var(--ui-shadow);
}

.format-toolbar::-webkit-scrollbar,.toolbar::-webkit-scrollbar {
    display:none;
}

.toolbar button, .format-toolbar button {
    flex-shrink:0;
    padding:8px 12px;
    border:1px solid var(--ui-border);
    background-color: var(--ui-btn-bg);
    cursor:pointer;
    border-radius: 8px;
    transition:0.2s ease;
    color: var(--ui-text);
}

.toolbar button:hover, .format-toolbar button:hover{
    background-color:var(--ui-panel);
    border-color:var(--ui-border-strong);
}

.editor{
    flex:1;
    width: 80%;
    padding:20px;
    background-color:var(--ui-panel);
    outline:none;
    overflow:auto;
    border:1px solid var(--ui-border);
    box-shadow:var(--ui-shadow);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}


#counter-box {
    justify-self: center;
    align-self: center;
    display: flex;
}

#word-counter {
    width: 20vw;
    align-items: baseline;
    margin-top: 10px;
    border:1px solid var(--ui-border);
    background:var(--ui-panel);
    color:var(--ui-text);
    text-align: center;
    margin-right: 1vw;
    border-radius: 8px;
}

#char-counter {
    width: 20vw;
    align-items: baseline;
    margin-top: 10px;
    border:1px solid var(--ui-border);
    background:var(--ui-panel);
    color:var(--ui-text);
    text-align: center;
    margin-left: 1vw;
    border-radius: 8px;
}

#charCounter::placeholder {
    font-size: xx-small;
}

.font-family {
    margin: 10px;
    background-color:var(--ui-panel);
    border:1px solid var(--ui-border);
    border-radius: 8px;
    box-shadow:var(--ui-shadow); 
    border-style: solid;
    padding: 3px;
    text-align: left;
    align-self: center;
    color: var(--ui-text);
}

.font-family select {
    background-color: var(--ui-panel);
    border-color: var(--ui-border);
    color: var(--ui-text);
}

#download-button{
    position: fixed;
    bottom: 6px;
    right: 6px;
    aspect-ratio: 1;
    border-radius: 50%;
    border:2px solid var(--ui-border);
    background-color: var(--ui-accent);
    box-shadow:var(--ui-shadow);
    cursor:pointer;
    padding: 4px 8px;
    border-bottom-right-radius: 0;
    transition: 0.2s ease-in-out;
}

#download-button:hover{
    padding:6px 10px;
}


.font-control-bar {
    position: absolute;
    top: 55%;
    right: 0px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 30px;
    z-index: 9997;
    padding: 0px;
    margin: 0 0.3rem;
}

.font-control-bar input[type="range"],
.font-control-bar input[type="color"] {
    writing-mode: vertical-lr;
    cursor: pointer;
    border: none;
    outline: none;
}


#font-color-changer {
    border-radius: 50%;
    width: 20px;
    height: 40px;
    border-style: none;
    transform: rotate(180deg);
}

#settings-icon {
    position: fixed;
    top: 12px;
    right: 12px;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ui-panel);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: 10px;
    box-shadow: var(--ui-shadow);
    cursor: pointer;
    transition: 0.2s ease;
}

#settings-icon:hover {
    background: var(--ui-btn-bg);
    border-color: var(--ui-border-strong);
    color: var(--ui-accent);
}

#settings-icon:active {
    transform: scale(0.95);
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 9997;
    background: var(--ui-transparent);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    opacity: 0;
    visibility: hidden;
    transition: 0.2s ease;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
}

.settings-panel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    width: min(420px, calc(100vw - 30px));
    max-height: calc(100vh - 30px);
    overflow-y: auto;
    padding: 20px;
    background: var(--ui-panel);                               
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: 14px;
    box-shadow: 2px 4px 8px var(--ui-shadow);
    z-index: 9998;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
}

.settings-panel.active {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
}

.settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--ui-border);
}

.settings-header h2 {
    font-size: 1.2rem;
    font-weight: 600;
}

#settings-close {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: var(--ui-btn-bg);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    transition: 0.2s ease-in-out;
}

#settings-close:hover {
    background: var(--ui-panel);
    border-color: var(--ui-border-strong);
    color: var(--ui-accent);
}

#settings-close:active {
    transform: scale(0.95);
}

.settings-content{
    display: flex;
    flex-direction: column;
    height: auto;
    width: 100%;
    padding: 2px;
    gap: 2px;
    color: var(--ui-text);
}

.settings-option{
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: start;
    width: 100%;
    height: auto;
    padding: 2px;
    border: 1px solid var(--ui-panel);
    transition: 0.3s ease-in-out;
    border-radius: 8px;
    font-size: clamp(0.8rem, 1vw, 1rem);
    color: var(--ui-text);
}

.settings-option:hover{
    border: 1px solid var(--ui-accent);
    background-color: var(--ui-accent);
}

.settings-option span {
    width: 50%;
}

.settings-option select {
    flex-grow: 1;
    text-align: center;
    background: inherit;
    transition: inherit;
    border: 1px solid var(--ui-border-strong);
    border-radius: 8px;
    color: var(--ui-text);}

.settings-option select option{
    background-color: var(--ui-panel);
    color: var(--ui-text);
}

@media (max-width: 768px){
    .editor{
        border-width:5px;
        border-radius:10px;
    }
}

@media (max-width: 500px){
    .editor{
        border-radius:8px;
    }
}

@media (max-width: 400px){
    .editor{
        border-width:3px;
        border-radius:5px;
    }
    .heading-container h1{
        font-size: x-large;
    }
    #settings-icon {
        right: 6px;
        top: 6px;
        padding: 3px;
    }
}

@media (max-width: 300px){
    .editor{
        border-width:2px;
    }
    .heading-container h1{
        font-size: larger;
    }

}

@media (max-width: 200px){
    #settings-icon {
        right: 0;
        top: 0;
        padding: 3px;
        border-radius: 0;
        border-bottom-left-radius: 8px;
    }

}



</style>
</head>

<script>


const editor = document.getElementById("editor");

const formatToolbar = document.getElementById("format-options");
const toolbar = document.getElementById("toolbar-options");

const wordOutput = document.getElementById('word-counter');
const charOutput = document.getElementById('char-counter');

function counters(){
  const text = editor.innerText.trim();
  wordOutput.value = text === "" ? 0 : text.split(/\s+/).length;
  charOutput.value = text.length;
}

counters();

editor.addEventListener('input', ()=>{
    counters();
});

function updateToolbarLayout(el) {
    if (el.scrollWidth > el.clientWidth) {
        el.style.justifyContent = "flex-start";
        el.style.overflowX = "auto";
    } else {
        el.style.justifyContent = "center";
        el.style.overflowX = "hidden";
    }
}

function updateLayouts() {
    updateToolbarLayout(formatToolbar);
    updateToolbarLayout(toolbar);
}

window.addEventListener("resize", updateLayouts);
updateLayouts();


formatToolbar.addEventListener("wheel", (e) => {
    e.preventDefault();

    formatToolbar.scrollLeft += e.deltaY;
});

toolbar.addEventListener("wheel", (e) => {
    e.preventDefault();

    toolbar.scrollLeft += e.deltaY;
});

document.getElementById("fontFamily").addEventListener("change", function () {
  const fam = this.value;
  const ed = editor;
  const sel = window.getSelection();
  ed.focus();

  if (sel.rangeCount > 0 && !sel.isCollapsed) {
    const rng = sel.getRangeAt(0);
    const frag = rng.extractContents();

    const sp = document.createElement("span");
    sp.style.fontFamily = fam;
    sp.appendChild(frag);

    rng.insertNode(sp);
    sel.removeAllRanges();
  } else {
    ed.querySelectorAll('[style]').forEach(el => {
    el.style.removeProperty("font-family");
    if (el.getAttribute("style")?.trim() === "") el.removeAttribute("style");
  });

  const span = document.createElement("span");
  span.style.fontFamily = fam;
  span.innerHTML = ed.innerHTML;
  ed.innerHTML = "";
  ed.appendChild(span);
  ed.focus();
  }
});

document.getElementById("font-color-changer").addEventListener("input", function () {
  const clr = this.value;
  const ed = editor;
  const sel = window.getSelection();
  ed.focus();

  if (sel.rangeCount > 0 && !sel.isCollapsed) {
    const rng = sel.getRangeAt(0);
    const frag = rng.extractContents();

    const sp = document.createElement("span");
    sp.style.color = clr;
    sp.appendChild(frag);

    rng.insertNode(sp);
    sel.removeAllRanges();
  } else {
     ed.querySelectorAll('[style]').forEach(el => {
    el.style.removeProperty("color");
    if (el.getAttribute("style")?.trim() === "") el.removeAttribute("style");
  });

  const span = document.createElement("span");
  span.style.color = clr;
  span.innerHTML = ed.innerHTML;
  ed.innerHTML = "";
  ed.appendChild(span);
  ed.focus();
  }
});

function format(tagName) {
  const selection = window.getSelection();
  editor.focus();

  if (selection.rangeCount > 0 && !selection.isCollapsed) {
    const range = selection.getRangeAt(0);
    const selectedText = range.extractContents();

    const cleanedText = document.createElement("span");
    cleanedText.innerHTML = selectedText.textContent;

    const el = document.createElement(tagName);
    el.textContent = cleanedText.textContent;

    range.insertNode(el);
    selection.removeAllRanges();
  } else {
  const tag = document.createElement(tagName);
  tag.innerHTML = editor.innerHTML;
  editor.innerHTML = "";
  editor.appendChild(tag);
}
 }

function clearFormat() {
    const selection = window.getSelection();

    if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
        const range = selection.getRangeAt(0);
        const selectedText = range.extractContents();

        const container = document.createElement("div");
        container.appendChild(selectedText);

        container.innerHTML = container.innerHTML
            .replace(/<\/?(b|i|u|s|code|mark|sup|sub|span)(\s[^>]*)?>/gi, "");

        range.insertNode(document.createRange().createContextualFragment(container.innerHTML));
        selection.removeAllRanges();
} else {
    editor.focus();
    document.execCommand("selectAll", false, null);
    document.execCommand("removeFormat", false, null);

    editor.innerHTML = editor.innerHTML
        .replace(/<\/?(b|i|u|s|code|mark|sup|sub|span)(\s[^>]*)?>/gi, "");

    editor.style.textAlign = "left";
    editor.style.fontFamily = `-apple-system, BlinkMacSystemFont, "Segoe UI",
Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif`;

    document.getElementById("fontFamily").value = "inherit";
}
}

function clearEditor(){
    let confirmation = confirm("Are you sure? This can not be undone.")
    if (confirmation){
      editor.innerHTML = "";
    }
}


function lineBreak() {
  const selection = window.getSelection();
  if (!selection.rangeCount) return;

  const range = selection.getRangeAt(0);

  if (!editor.contains(range.commonAncestorContainer)) return;

  range.deleteContents();
  const br = document.createElement("br");
  range.insertNode(br);

  // Move cyrsor after br
  range.setStartAfter(br);
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
}

function backSpaceFun() {
    editor.focus();
    const selection = window.getSelection();

    if (!selection.rangeCount) return;

    if (!selection.isCollapsed) {
        document.execCommand("delete");
        counters();
        return;
    }

    selection.modify("extend", "backward", "character");

    if (!selection.isCollapsed) {
        document.execCommand("delete");
    }
    counters();
}


function cleanupEmptyNodes(root) {
    const walker = document.createTreeWalker(
        root,
        NodeFilter.SHOW_ELEMENT
    );
    const toRemove = [];
    while (walker.nextNode()) {
        const node = walker.currentNode;
        if (
            node !== root &&
            node.childNodes.length === 0
        ) {
            toRemove.push(node);
        }}
    for (const node of toRemove) {
        node.remove();
    }
}

  editor.style.textAlign = "right";
}

function leftAlign() {
  editor.style.textAlign = "left"; 
}

function centerAlign() {
  editor.style.textAlign = "center";

function saveFile() {
  const content = editor.innerHTML;
  const fullHTML = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Downloaded Content</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          padding: 20px;
        }
      </style>
    </head>
    <body>
        <div style="text-align:${editor.style.textAlign}">
            ${editor.innerHTML}
        </div></body>
    </html>
  `;

  const blob = new Blob([fullHTML], { type: "text/html" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "new.html";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

const settingsIcon = document.getElementById("settings-icon");
const settingsPanel = document.querySelector(".settings-panel");
const settingsOverlay = document.querySelector(".overlay");
const settingsClose = document.getElementById("settings-close");


const settings = {
  formatToolbarPosition: "auto",
  theme: "auto"
};

const settingOptions = {
  formatToolbarPosition: ["auto", "top", "bottom"],
  theme: ["auto", "light", "dark"]
};

let settingsOpen = false;

function openSettings() {
    settingsOpen = true;

    settingsPanel.classList.add("active");
    settingsOverlay.classList.add("active");

    settingsIcon.setAttribute("aria-expanded", "true");
}

function closeSettings() {
    settingsOpen = false;

    settingsPanel.classList.remove("active");
    settingsOverlay.classList.remove("active");

    settingsIcon.setAttribute("aria-expanded", "false");
}

function toggleSettings() {
    if (settingsOpen) {
        closeSettings();
    } else {
        openSettings();
    }
}


settingsIcon.addEventListener("click", toggleSettings);

settingsClose.addEventListener("click", closeSettings);

settingsOverlay.addEventListener("click", closeSettings);


document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && settingsOpen) {
        closeSettings();
    }
});

function settingManager(setting, value) {
    if (!settingOptions[setting]?.includes(value)) return;

    settings[setting] = value;

    if (setting === "formatToolbarPosition") {
        setFormatToolbarPosition(value);
    }
    if (setting === "theme") {
        setTheme(value);
    }
}

// Helpers and utilities
 
function detectFormatToolbarPosition() {
    return navigator.maxTouchPoints > 0 ? "bottom" : "top";
}

function getPreferredTheme() {
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

// Setting functions

function setFormatToolbarPosition(position) {
    if (position === "auto") {
        position = detectFormatToolbarPosition();
    }

    const formatToolbar = document.getElementById("format-toolbar");
    const editor = document.getElementById("editor");
    const toolbar = document.getElementById("toolbar");
    const fontFamily = document.querySelector(".font-family");
    const counterBox = document.getElementById("counter-box");

    if (position === "bottom") {
        editor.style.order = "1";
        formatToolbar.style.order = "2";
        toolbar.style.order = "3";
    } else {
        formatToolbar.style.order = "1";
        editor.style.order = "2";
        toolbar.style.order = "3";
    }

    fontFamily.style.order = "4";
    counterBox.style.order = "5";
}
setFormatToolbarPosition(settings.formatToolbarPosition);

function setTheme(theme) {
    const dark = theme === "auto"
        ? window.matchMedia("(prefers-color-scheme: dark)").matches
        : theme === "dark";

    document.body.classList.toggle("dark-mode", dark);
}
setTheme(settings.theme);

// Settings listeners

document.getElementById("format-toolbar-position").addEventListener("change", (event) => {
    settingManager("formatToolbarPosition", event.target.value);
});

document.getElementById("theme").addEventListener("change", (event) => {
    settingManager("theme", event.target.value);  
})
